name: Android CI

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Seconds, and needs no toolchain — so it runs before the Gradle work and fails
      # fast if the card transcription or the timing model has drifted. The chart is
      # hand-copied from a physical card; nothing else in the build would catch a pad
      # in the wrong cell or a code that no longer matches the ITU alphabet.
      - name: Verify card chart and timing
        run: |
          node tools/verify_chart.js \
            app/src/main/java/com/normo/morsetrainer/core/CardChart.kt
          node tools/verify_timing.js

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ubuntu-latest ships Gradle; use it to (re)generate the full wrapper
      # (including gradle-wrapper.jar) so ./gradlew works for all later steps.
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 9.5.1 --distribution-type bin

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Lint
        run: ./gradlew lintDebug

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: MorseTrainer-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

  release:
    name: Create Release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Download debug APK from the build job
        uses: actions/download-artifact@v5
        with:
          name: MorseTrainer-debug
          path: apk

      - name: Stage release assets under a stable filename
        run: |
          mkdir -p release
          cp apk/*.apk release/MorseTrainer-debug.apk

      - name: Compute release tag
        id: tag
        run: |
          version=$(sed -n 's/.*versionName *= *"\(.*\)".*/\1/p' app/build.gradle.kts)
          echo "tag=v${version}-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # The QR code encodes GitHub's stable "latest release" download URL, not
      # this run's own tag — so the same QR code (screenshot it once) always
      # resolves to whatever build is newest, forever, as long as the asset
      # filename stays "MorseTrainer-debug.apk".
      - name: Generate QR code for the APK download link
        env:
          APK_URL: https://github.com/${{ github.repository }}/releases/latest/download/MorseTrainer-debug.apk
        run: |
          pip install --quiet qrcode[pil]
          python - <<'PY'
          import os
          import qrcode
          url = os.environ["APK_URL"]
          qrcode.make(url).save("release/qr-code.png")
          print(f"QR encodes: {url}")
          PY

      - name: Write release notes header
        env:
          APK_URL: https://github.com/${{ github.repository }}/releases/latest/download/MorseTrainer-debug.apk
          QR_URL: https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag }}/qr-code.png
        run: |
          cat > release/notes.md <<EOF
          Scan to install the latest debug build:

          ![Download QR code]($QR_URL)

          Direct link: $APK_URL

          This is an unsigned debug APK built automatically from \`main\`. You will
          need to allow installation from unknown sources to sideload it.
          EOF

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            release/MorseTrainer-debug.apk \
            release/qr-code.png \
            --title "Morse Trainer ${{ steps.tag.outputs.tag }}" \
            --notes-file release/notes.md \
            --generate-notes
